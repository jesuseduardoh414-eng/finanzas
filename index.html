<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex, nofollow">
  <title>Finanzas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 id="titulo">Finanzas</h1>
    <span id="sync" class="sync" hidden></span>
  </header>

  <main id="vista"></main>

  <button id="fab" class="fab" type="button" aria-label="Agregar ingreso o gasto" hidden>+</button>

  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-tab="inicio">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </button>
    <button type="button" data-tab="semanas">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Semanas</span>
    </button>
    <button type="button" data-tab="medeben">
      <svg viewBox="0 0 24 24"><path d="M17 7 7 17M7 9v8h8"/></svg>
      <span>Me deben</span>
    </button>
    <button type="button" data-tab="debo">
      <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
      <span>Debo</span>
    </button>
    <button type="button" data-tab="recs">
      <svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>
      <span>Recurrentes</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input id="archivo" type="file" accept="application/json,.json" hidden>

  <script src="config.js"></script>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
